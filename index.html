function at(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function place(i,l){if(finished||given.has(i)||filled.has(i))return;if(seq[i]!==l){let n=(misses.get(i)||0)+1;misses.set(i,n);wrongTile=l;wrongUntil=performance.now()+350;if(n>=2){const prev=seq[(i-1+seq.length)%seq.length];message(prev==='G'?'After G, the alphabet starts again at A!':`What comes after ${prev}?`);if(round>=3)showHint=true}else message('Almost! Try another letter.');return}filled.set(i,l);glow=i;setTimeout(()=>{if(glow===i)glow=-1},500);playNote(i);selected=null;message('Great stepping!');if(filled.size+given.size===q.count){finished=true;replayButton.disabled=false;celebrateAt=performance.now();message('Tail complete! Listen to the rising scale.');setTimeout(playScale,900)}}
// Lowest playable pitch is A3. Starting on C–G uses octave 4,
// while A/B may begin in octave 3. Every B→C raises the octave.
function noteName(i){
  let octave=(seq[0]==='A'||seq[0]==='B')?3:4;
  for(let k=1;k<=i;k++)if(seq[k]==='C')octave++;
  return seq[i]+octave;
}
// Pitch audio (A3 minimum): use local piano MP3s when present, otherwise a gentle synthesized tone.
// No sound assets or internet are required for the synthesized fallback.
let audioContext=null;
const noteSemitones={C:0,D:2,E:4,F:5,G:7,A:9,B:11};

function ensureAudio(){
  try{
    if(!audioContext){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioContext=new AC();}
    if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
    return audioContext;
  }catch(e){return null;}
}
function synthPitch(name,kind){
  const ac=ensureAudio();if(!ac)return;
  const letter=name[0],octave=Number(name.slice(1));
  const midi=12*(octave+1)+noteSemitones[letter];
  const hz=440*Math.pow(2,(midi-69)/12);
  const now=ac.currentTime;
  const output=ac.createGain();output.gain.value=0.75;output.connect(ac.destination);
  const envelope=ac.createGain();envelope.gain.setValueAtTime(0.0001,now);
  if(kind==='flute'){
    // Airy flute-like tone with a smooth onset and soft sine harmonics.
    envelope.gain.linearRampToValueAtTime(0.14,now+0.075);
    envelope.gain.setValueAtTime(0.14,now+0.36);
    envelope.gain.exponentialRampToValueAtTime(0.0001,now+0.72);
  }else{
    envelope.gain.exponentialRampToValueAtTime(0.14,now+0.012);
    envelope.gain.exponentialRampToValueAtTime(0.0001,now+0.62);
  }
  envelope.connect(output);
  const partials=kind==='flute'?[1,0.105,0.028]:[1,0.18,0.07];
  partials.forEach((volume,index)=>{
    const osc=ac.createOscillator();osc.type='sine';osc.frequency.value=hz*(index+1);
    const part=ac.createGain();part.gain.value=volume;
    if(kind==='flute'){
      const vibrato=ac.createOscillator(),depth=ac.createGain();
      vibrato.frequency.value=4.8;depth.gain.value=hz*0.0014;
      vibrato.connect(depth);depth.connect(osc.frequency);
      vibrato.start(now);vibrato.stop(now+0.74);
    }
    osc.connect(part);part.connect(envelope);
    osc.start(now);osc.stop(now+(kind==='flute'?0.74:0.65));
  });
}
const sampleMissing=new Set();
function playNote(i){
  const name=noteName(i),kind=instrument;
  if(!/^[A-G][3-6]$/.test(name))return;
  ensureAudio();
  // Instrument-specific samples; missing files fall back to synthesis.
  const path=`sounds/${kind}/${name}.mp3`;
  if(sampleMissing.has(path)){synthPitch(name,kind);return;}
  const audio=new Audio(path);audio.volume=.7;
  let fallbackDone=false;
  const fallback=()=>{if(fallbackDone)return;fallbackDone=true;sampleMissing.add(path);synthPitch(name,kind)};
  audio.addEventListener('error',fallback,{once:true});
  const attempt=audio.play();if(attempt?.catch)attempt.catch(fallback);
}
async function playScale(){const token=++noteToken;for(let i=0;i<seq.length;i++){if(token!==noteToken)return;glow=i;playNote(i);await new Promise(r=>setTimeout(r,280))}if(token===noteToken)glow=-1}
async function hint(){if(finished)return;const i=seq.findIndex((_,j)=>!given.has(j)&&!filled.has(j));if(i<0)return;hintStage=Math.min(3,hintStage+1);if(hintStage===1){glow=i-1;setTimeout(()=>glow=-1,1000);message(`What comes after ${seq[i-1]}?`)}else if(hintStage===2){message('Listen to the notes before the gap.');for(let k=Math.max(0,i-3);k<i;k++){playNote(k);await new Promise(r=>setTimeout(r,320))}}else{selected=seq[i];message('Look for the highlighted letter on the log!')}}
function clickAt(p){if(round===5){round=0;init();return}if(p.x<140&&p.y>800){round=0;init();return}if(finished&&p.x>1480&&p.y>800){if(round===4){round=5;message('All tails done!')}else{round++;init()}return}if(showHint&&p.x>1340&&p.x<1530&&p.y>805){hint();return}const tile=tileRects.find(t=>at(p.x,p.y,t));if(tile){selected=tile.l;message(`Selected ${selected}. Tap an empty stripe.`);return}const slot=slotRects.find(s=>at(p.x,p.y,s));if(slot&&selected)place(slot.i,selected)}
